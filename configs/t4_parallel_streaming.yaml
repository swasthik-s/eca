model:
  architecture: ECAParallelMatrixModel
  version: "0.5-experimental"
  hidden_size: 256
  byte_embedding_size: 64
  depth: 2
  kernel_size: 5
  input_alphabet: 257
  output_alphabet: 257
  recurrence: elementwise_affine_associative_scan
  attention: false
  transformer_components: false
  tokenizer: raw_utf8_bytes
streaming:
  source: HuggingFaceFW/fineweb-edu
  config: sample-10BT
  lazy_document_iterator: true
  producer: asynchronous_bounded_fifo
  lanes: 8
  buffer_symbols_total: 262144
  low_watermark: 0.30
  high_watermark: 0.90
  document_assignment: round_robin_whole_documents
training:
  initial_steps: 1500
  batch_size: 8
  sequence_length: 256
  precision: fp16
  validation_bytes: 200000
recovery:
  validation_metric: bits_per_byte
  evaluation_interval: 50
  patience: 3
  learning_rate_multiplier: 0.5
  extra_steps_per_recovery: 200
  maximum_recoveries: 3
checkpoints:
  best: checkpoints/eca_0_5_best.pt
  latest: checkpoints/eca_0_5_latest.pt
notes:
  - Dataset documents are yielded lazily; the corpus is not materialized as a list.
  - Whole documents are assigned round-robin to independent recurrent lanes.
  - Each lane preserves its byte order and recurrent state across batches.
  - The bounded producer applies backpressure at the high watermark.
  - Validation documents are held separately from the training iterator.
  - One async source producer is used; multiple network fetch workers are not yet implemented.
  - BPB measures next-byte prediction, not reasoning or semantic understanding.
