[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eca-cognitive"
version = "0.2.0"
description = "Experimental EvolveAI Cognitive Architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
train = ["torch>=2.2", "datasets>=2.19", "pyyaml>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "torch>=2.2"]

[tool.setuptools.packages.find]
include = ["eca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
